<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            /* Global reset */
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .newspaper-box {
                background-color: #dad5d5; 
                border: 2px solid #000000; 
                width: 640px;             
                height: 5000px; 
                box-sizing: border-box;  
                margin: auto; 
                margin-top: 75px; 
                position: relative;
            }
            .newspaper-title {
                font-family: 'Edwardian Script ITC', 'Kunstler Script', 'Bickham Script Pro', serif;
                color: #000000;            
                text-align: left;  
                margin: 10px;                 
                font-size: 85px;         
                text-transform: none; 
                font-weight: bold;
                display: block;
            }
            .slogan {
                font-family: Georgia, 'Times New Roman', Times, serif;
                color: #dad5d5;
                font-weight: 800;
                font-size: 22px;
                background-color: #2f2f2f;
                text-align: center;
                padding: 7px;
                margin-top: -7px;
            }
            .slogan-french {
                font-family: 'Times New Roman', Times, serif;
                color: #2f2f2f;
                font-weight: 1500;
                font-size: 20px;
                text-align: center;
                margin-top: -150px;
                margin-right: -360px;
            }

            /* --- NEW SUBHEADER ROW (Text + Images side-by-side) --- */
            .subheader-row {
                display: flex;
                justify-content: space-between;
                align-items: center; /* Keeps text and images level */
                padding: 0 40px;
                margin-top: 25px; /* Clean gap below the masthead */
            }

            .subheading {
                font-family: Georgia, 'Times New Roman', Times, serif;
                font-weight: bold;
                color: black;
                font-size: 17px;
                margin: 0; /* Reset margins to let flexbox handle alignment */
            }

            /* HORIZONTAL IMAGE SYSTEM */
            .image-row-desktop {
                display: flex;
                flex-direction: row; /* Forces images to sit in a line */
                align-items: center;
                gap: 15px; /* Perfect space between images */
            }
            .img1-img { width: 130px; height: 130px; object-fit: contain; }
            .img2-img { width: 130px; height: 130px; object-fit: contain; }
            .img3-img { width: 160px; height: 160px; object-fit: contain; }

            /* --- ARTICLES SECTION --- */
            .article-links {
                display: flex;
                flex-direction: column;
                gap: 15px; /* Controlled distance between Link 1 and Link 2 */
                padding: 0 40px;
                margin-top: 30px; /* FIXED: Gentle spacing from the subheader line */
            }
            .text1, .text2 {
                font-family: Georgia, 'Times New Roman', Times, serif;
                color: black;
                font-size: 14px;
                text-decoration: none;
                line-height: 1.4;
                text-align: left;
            }

            /* Desktop absolute fixed decorations */
            .landscape {
                position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 9999; width: 1199px; height: 667px; pointer-events: none;
            }
            .dps {
                color: black; font-size: 20px; font-family: Georgia, 'Times New Roman', Times, serif; position: fixed; bottom: 450px; left: 142px; z-index: 10000;
            }

            /* Responsive rules for mobile screen views */
            @media (max-width: 1099px) {
                .newspaper-box {
                    width: 100%;          
                    max-width: 100%;
                    height: auto;         
                    min-height: 100vh;   
                    margin-top: 0;       
                }
                .landscape,
                .slogan-french,
                .dps {
                    display: none !important;
                }
                
                /* Hides the images container completely on mobile */
                .image-row-desktop {
                     display: none !important;
                }
                
                /* Cleans up subheader position so it doesn't clip on mobile */
                .subheader-row {
                    display: block;
                    padding: 0 20px;
                    margin-top: 15px;
                }
                .subheading {
                    text-align: left;
                }

                /* Mobile spacing for article list layout */
                .article-links {
                    padding: 0 20px;
                    margin-top: 20px; /* Clean gap on phone viewports */
                    gap: 20px;
                }
                .text1, .text2 {
                    font-size: 16px; 
                }
            }
        </style>
    </head>
    <body style="background-color: cornsilk;">
        <div class="newspaper-box">
            <br>
            <h1 class="newspaper-title">The Intellekt</h1> 
            <h3 class="slogan">यत्र सत्यस्य गभीरात् शब्दाः निर्गच्छन्ति।</h3>
            <h3 class="slogan-french">JE PENSE, <br> DONC QUE JE SUIS!</h3>
            
            <!-- NEW ROW: "August Edition" and Horizontal Images sit side-by-side -->
            <div class="subheader-row">
                <h5 class="subheading">August Edition</h5> 
                
                <div class="image-row-desktop">
                    <img src="images/image (1).png" class="img1-img" alt="Graphic 1">
                    <img src="images/image (2).png" class="img2-img" alt="Graphic 2">
                    <img src="images/narcissus.png" class="img3-img" alt="Narcissus">
                </div>
            </div> 

            <!-- NEW CLEAN LINKS STACK (With manageable text gaps) -->
            <div class="article-links">
                <a href="articles-intellekt/aug-01.html" class="text1">
                    01: "Coming-of-Age" <br> A lie concealed in the TV screen?
                </a>
                <a href="articles-intellekt/aug-02.html" class="text2">
                    02: Narcissus: <br> Are we really any different?
                </a>
            </div>

        </div> <!-- Main Newspaper End -->

        <img src="images/7d80ef285fed66f56e3843446fee56e2 (1).png" class="landscape">
        <h2 class="dps">No matter what <br> anybody tells you, <br> Words and ideas can <br> change the world." </h2>
    </body>
</html>
